# Bygger sitet og lægger det på nettet, hver gang der kommer en ændring på main.
# Adressen (midlertidig github.io-adresse eller kristianverner.dk) læses fra GitHubs
# egne indstillinger under Settings > Pages, så der skal ikke rettes noget her, når domænet kobles på.
name: Udgiv sitet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Adressen skrives altid som https, også før GitHub har slået HTTPS til på domænet.
      - run: |
          ORIGIN="${{ steps.pages.outputs.origin }}"
          npx astro build --site "${ORIGIN/http:\/\//https://}" --base "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
